services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10&pool_timeout=20
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    networks:
      - knowledge-hub
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledge-hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  vectordb:
    build:
      context: ./docker/qdrant
      dockerfile: Dockerfile
    image: knowledge-hub-qdrant:1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - knowledge-hub
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6333/readyz >/dev/null || curl -sf http://127.0.0.1:6333/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  adminer:
    profiles:
      - debug
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - knowledge-hub
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

networks:
  knowledge-hub:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
